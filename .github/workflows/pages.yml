name: pages

# Publishes the CIP-30 demo dapp to GitHub Pages:
#   https://bloxbean.github.io/yano-wallet/tx-demo/
#
# It exists because GETTING-STARTED.md's last step — "open a dApp and choose
# Yano" — has nowhere to point: the connector extension is not in the Chrome
# Web Store, so no third-party dapp lists Yano yet. A hosted page gives a new
# user something to verify their install against.
#
# Only Connect and "send to myself" run here. The Plutus lock/unlock flows read
# cost models through the Vite dev-server proxy, which a static host has no
# equivalent for, so the demo disables them outside `npm run dev` (see
# src/main.ts). Connect and send need no chain provider at all.
#
# main only. The github-pages environment restricts deployments to the default
# branch, so a run from a feature branch would fail the protection rule; verify
# a branch locally with
#   DEMO_BASE=/yano-wallet/tx-demo/ npm run build && npx vite preview

on:
  push:
    branches: [main]
    paths:
      - 'wallet-connector/dev/tx-demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: wallet-connector/dev/tx-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - uses: actions/configure-pages@v5

      # A project site lives under /<repo>/, so the built asset URLs must carry
      # that prefix. Without it the page loads and the script 404s — a blank page.
      - name: Build
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/tx-demo/
        run: npm run build

      # The artifact's contents become the site ROOT, so the build is staged
      # under tx-demo/ rather than uploaded directly — that keeps
      # /yano-wallet/ free for documentation later instead of the demo
      # occupying it and having to move (a moved URL is a dead link in every
      # zip's GETTING-STARTED.md already shipped).
      - name: Stage the site
        run: |
          set -euo pipefail
          site="$GITHUB_WORKSPACE/_site"
          mkdir -p "$site/tx-demo"
          cp -R dist/. "$site/tx-demo/"
          # Placeholder so the site root is not a 404 — deploy-pages reports the
          # root as this run's URL. Replace it when real docs land.
          cat > "$site/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Yano Wallet</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <body style="font:14px/1.6 system-ui,sans-serif;background:#12162c;color:#eef1ff;display:grid;place-items:center;min-height:100vh;margin:0">
          <main style="text-align:center">
          <h1 style="font-size:20px;margin:0 0 6px">Yano Wallet</h1>
          <p style="color:#9aa4d6;margin:0 0 14px">A full-node Cardano desktop wallet.</p>
          <p><a style="color:#93c5fd" href="tx-demo/">CIP-30 demo dApp</a> &middot;
             <a style="color:#93c5fd" href="https://github.com/bloxbean/yano-wallet">Source</a></p>
          </main>
          HTML
          ls -R "$site" | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
