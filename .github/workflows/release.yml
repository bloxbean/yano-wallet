name: release

# Builds the Yano Wallet desktop app per OS and publishes two artifacts each:
#   * a native installer with a bundled open-source JRE — no Java needed
#     (dmg / msi / deb)
#   * a portable "bring your own Java 25+" zip (jars + launch scripts)
#
# Plus one OS-independent artifact built once, in its own job:
#   * the browser extension zip (CIP-30 connector) — unzip, then Load unpacked
#
#   release : push a tag v<version>  -> attaches the files to that tag's RELEASE
#   dry run : Actions > Run workflow -> builds everything, publishes nothing
#
# No upload-artifact on purpose: on a tag the Release assets already are the
# download, so an artifact is just a second copy of a multi-hundred-MB zip.
# Use dev-release.yml when you want the files without cutting a Release.
#
# Only tagged pushes land on a Release; everyday pushes and pull requests are
# built by build.yml, which skips packaging entirely so it stays fast.
#
# jpackage cannot cross-compile, so one runner per OS. The JDK is an OpenJDK
# build (Temurin, GPLv2+CE) — never Oracle JDK — so the bundled runtime is freely
# redistributable. JavaFX + hardware-wallet natives ride the app's classpath, so
# each build is OS/arch-specific (both the installer and the portable zip).

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15           # Apple Silicon
            platform: macos-arm64
          - os: ubuntu-22.04       # x86_64
            platform: linux-x86_64
          - os: ubuntu-22.04-arm   # aarch64
            platform: linux-arm64
          - os: windows-latest     # x86_64
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenJDK 25 (Temurin — GPLv2+CE, redistributable runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Resolve version (tag > gradle.properties)
        id: ver
        shell: bash
        run: |
          # Tag v0.1.0 -> version 0.1.0. The prefix must be stripped here or it
          # ends up in every artifact filename ("yano-wallet-macos_arm64_v0.1.0").
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(grep -m1 '^walletVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Install deb tooling (Linux installer)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Install WiX Toolset (Windows installer)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # The bundled node is a released Yano distribution (~256 MB), not built here.
      # Cache it on the pinned version so it downloads once per bump, not per run.
      - name: Read pinned Yano node version
        id: node
        shell: bash
        run: echo "version=$(grep -m1 '^yanoVersion' gradle.properties | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache Yano node distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/yano-dist
          key: yano-dist-${{ steps.node.outputs.version }}

      # MUST be its own Gradle invocation, not left to :stageForJpackage's
      # dependsOn. That task is a Copy whose source is the distribution
      # directory, and Gradle resolves a Copy's sources while BUILDING the task
      # graph — before any task, including :fetchYanoNode, has run. So on a cold
      # cache the packaging build fails at configuration time with "Yano node
      # distribution … is not available", which is exactly what happened on all
      # four runners the first time this workflow was tagged. Fetching in a
      # separate invocation means the directory already exists when the next one
      # configures. On a cache hit the task is a no-op.
      - name: Fetch pinned Yano node distribution
        shell: bash
        run: ./gradlew fetchYanoNode --no-daemon

      # jpackage jlinks the bundled JRE from this Temurin JDK.
      - name: Build installer + portable zip (${{ matrix.platform }})
        shell: bash
        run: ./gradlew :wallet-app:jpackageInstaller :wallet-app:walletZip --no-daemon

      # jpackage names the installer "Yano Wallet-<ver>.<ext>" and the zip carries
      # the gradle version; rename both to yano-wallet-<os>_<arch>_<version> so the
      # Releases page is unambiguous. Native extensions stay runnable/installable.
      - name: Rename artifacts with os/arch/version
        shell: bash
        run: |
          cd wallet-app/build/dist
          osarch="${{ matrix.platform }}"; osarch="${osarch//-/_}"
          ver="${{ steps.ver.outputs.version }}"
          shopt -s nullglob
          for f in *.dmg *.pkg *.msi *.exe *.deb *.rpm; do
            mv -v "$f" "yano-wallet-${osarch}_${ver}.${f##*.}"
          done
          for f in yano-wallet-*.zip; do
            case "$f" in *_"${ver}"-portable.zip) continue;; esac
            mv -v "$f" "yano-wallet-${osarch}_${ver}-portable.zip"
          done
          ls -la

      - name: Attach to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wallet-app/build/dist/*.dmg
            wallet-app/build/dist/*.pkg
            wallet-app/build/dist/*.msi
            wallet-app/build/dist/*.exe
            wallet-app/build/dist/*.deb
            wallet-app/build/dist/*.rpm
            wallet-app/build/dist/*-portable.zip
          fail_on_unmatched_files: false

  # The browser extension is the same bytes everywhere — plain JS, no natives,
  # no JRE. Deliberately NOT part of the matrix above: four runners would each
  # build an identical zip and then race to attach it to the same release.
  #
  # It is versioned by wallet-connector/manifest.json, not by the tag: the
  # extension ships on Chrome Web Store review cycles, so its version moves
  # independently of the desktop app's.
  connector:
    name: Browser connector (CIP-30 extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenJDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package browser connector
        run: ./gradlew connectorZip --no-daemon

      - name: Attach to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/yano-connector-*.zip
          fail_on_unmatched_files: true
