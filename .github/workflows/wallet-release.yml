name: release (Yano Wallet)

# Builds the Yano Wallet desktop app per OS and publishes two artifacts each:
#   * a native installer with a bundled open-source JRE — no Java needed
#     (dmg / msi / deb)
#   * a portable "bring your own Java 25+" zip (jars + launch scripts)
#
#   preview : Actions > Run workflow            -> uploads as workflow ARTIFACTS
#   release : push a tag  wallet-v<version>      -> uploads to the RELEASE for that tag
#
# jpackage cannot cross-compile, so one runner per OS. The JDK is an OpenJDK
# build (Temurin, GPLv2+CE) — never Oracle JDK — so the bundled runtime is freely
# redistributable. JavaFX + hardware-wallet natives ride the app's classpath, so
# each build is OS/arch-specific (both the installer and the portable zip).

on:
  push:
    tags: ['wallet-v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14           # Apple Silicon
            platform: macos-arm64
          - os: ubuntu-22.04       # x86_64
            platform: linux-x86_64
          - os: ubuntu-22.04-arm   # aarch64
            platform: linux-arm64
          - os: windows-latest     # x86_64
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenJDK 25 (Temurin — GPLv2+CE, redistributable runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Resolve version (tag > gradle.properties)
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#wallet-v}"
          else
            V=$(grep -m1 '^walletVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Install deb tooling (Linux installer)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Install WiX Toolset (Windows installer)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # The bundled node is a released Yano distribution (~256 MB), not built here.
      # Cache it on the pinned version so it downloads once per bump, not per run.
      - name: Read pinned Yano node version
        id: node
        shell: bash
        run: echo "version=$(grep -m1 '^yanoVersion' gradle.properties | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache Yano node distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/yano-dist
          key: yano-dist-${{ steps.node.outputs.version }}

      # Both tasks depend on :fetchYanoNode, which resolves the pinned distribution
      # (cache hit above). jpackage jlinks the bundled JRE from this Temurin JDK.
      - name: Build installer + portable zip (${{ matrix.platform }})
        shell: bash
        run: ./gradlew :wallet-app:jpackageInstaller :wallet-app:walletZip --no-daemon

      # jpackage names the installer "Yano Wallet-<ver>.<ext>" and the zip carries
      # the gradle version; rename both to yano-wallet-<os>_<arch>_<version> so the
      # Releases page is unambiguous. Native extensions stay runnable/installable.
      - name: Rename artifacts with os/arch/version
        shell: bash
        run: |
          cd wallet-app/build/dist
          osarch="${{ matrix.platform }}"; osarch="${osarch//-/_}"
          ver="${{ steps.ver.outputs.version }}"
          shopt -s nullglob
          for f in *.dmg *.pkg *.msi *.exe *.deb *.rpm; do
            mv -v "$f" "yano-wallet-${osarch}_${ver}.${f##*.}"
          done
          for f in yano-wallet-*.zip; do
            case "$f" in *_"${ver}"-portable.zip) continue;; esac
            mv -v "$f" "yano-wallet-${osarch}_${ver}-portable.zip"
          done
          ls -la

      - name: Upload workflow artifacts (preview + release)
        uses: actions/upload-artifact@v4
        with:
          name: yano-wallet-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: |
            wallet-app/build/dist/*.dmg
            wallet-app/build/dist/*.pkg
            wallet-app/build/dist/*.msi
            wallet-app/build/dist/*.exe
            wallet-app/build/dist/*.deb
            wallet-app/build/dist/*.rpm
            wallet-app/build/dist/*-portable.zip
          if-no-files-found: error

      - name: Attach to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wallet-app/build/dist/*.dmg
            wallet-app/build/dist/*.pkg
            wallet-app/build/dist/*.msi
            wallet-app/build/dist/*.exe
            wallet-app/build/dist/*.deb
            wallet-app/build/dist/*.rpm
            wallet-app/build/dist/*-portable.zip
          fail_on_unmatched_files: false
