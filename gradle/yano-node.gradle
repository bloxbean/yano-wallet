// Resolves the Yano node distribution that the wallet launches (dev) and bundles
// (packaging).
//
// The wallet does NOT depend on Yano as a library — there is nothing to link
// against. The node is a separate Quarkus process the wallet spawns and then
// talks to over REST. What the build needs is therefore an *artifact*, not a
// dependency: a released distribution directory.
//
// It must be the DISTRIBUTION, not a bare yano.jar. The node reads genesis from
// its working directory (config/network/<network>/{byron,shelley,alonzo,conway}
// -genesis.json); only application.yml is baked into the jar. A lone jar cannot
// start a real network.
//
// Resolution order (first hit wins), mirroring what NodeLocator does at runtime:
//   1. -PyanoDist=/path/to/yano-<version>   explicit local build/unpacked dist
//      (or the YANO_DIST environment variable)
//   1b. ./.yano-node/{yano.jar,config}     project-local link to a locally built
//       node (git-ignored; symlinks are fine)
//   2. the shared cache under ~/.gradle/yano-dist/yano-<version>/
//   3. download the pinned release from GitHub, verify SHA-256, unpack to (2)
//
// So local dev and offline builds never hit the network, and CI downloads once
// per version bump (cache the directory keyed on yanoVersion).

def yanoVersion = project.findProperty('yanoVersion') ?: '0.1.0-pre13'
def cacheRoot = new File(gradle.gradleUserHomeDir, "yano-dist")

// -PyanoNative selects the platform-specific native distribution instead of the
// JVM one (ADR-044). The native node is a single executable rather than a jar,
// so the artifact name, the cache directory and the marker file all change —
// but the layout inside is identical (config/network/<network>/ beside the
// binary), which is why NodeLocator.workingDirFor needs no change.
ext.yanoNativeRequested = project.hasProperty('yanoNative')

// Yano publishes exactly the four platforms this project releases on; there is
// deliberately no macOS-x64 entry because we do not build for it either.
ext.yanoNativePlatform = { ->
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def aarch64 = arch.contains('aarch64') || arch.contains('arm64')
    if (os.contains('mac') || os.contains('darwin')) {
        if (!aarch64) {
            throw new GradleException("Yano publishes no native build for macOS x86_64. "
                    + "Use the JVM distribution (drop -PyanoNative) on Intel Macs.")
        }
        return 'macos-arm64'
    }
    if (os.contains('windows')) return 'windows-x64'
    if (os.contains('linux')) return aarch64 ? 'linux-arm64' : 'linux-x64'
    throw new GradleException("No Yano native distribution for os=${os} arch=${arch}")
}

def nativePlatform = yanoNativeRequested ? yanoNativePlatform() : null
def distName = yanoNativeRequested
        ? "yano-native-${yanoVersion}-${nativePlatform}"
        : "yano-${yanoVersion}"
def distDir = new File(cacheRoot, distName)
def zipName = "${distName}.zip"
def downloadUrl = "https://github.com/bloxbean/yano/releases/download/v${yanoVersion}/${zipName}"

/** The file that marks a usable distribution: a jar, or the native executable. */
ext.yanoNodeMarker = { File dir ->
    if (yanoNativeRequested) {
        def exe = new File(dir, System.getProperty('os.name').toLowerCase().contains('windows')
                ? 'yano.exe' : 'yano')
        return exe
    }
    return new File(dir, 'yano.jar')
}

// Pinned checksums: version -> sha256 of the release zip. Yano's releases do not
// publish .sha256 assets yet, so we record the hash when pinning a version.
// Populate with: ./gradlew yanoNodeChecksum -PyanoVersion=<version>
def checksumFile = file("$rootDir/gradle/yano-node.lock")
// Keyed by ARTIFACT, not by version: the native builds are one zip per platform,
// so a single per-version checksum cannot cover them.
def expectedSha = { String artifact ->
    if (!checksumFile.exists()) return null
    def line = checksumFile.readLines().find { it.trim().startsWith("${artifact}=") }
    return line ? line.split('=', 2)[1].trim() : null
}

/** The resolved distribution directory, or null if it is not available yet. */
ext.resolveYanoDist = { boolean required ->
    def override = project.findProperty('yanoDist') ?: System.getenv('YANO_DIST')
    if (override) {
        def dir = file(override)
        if (!dir.isDirectory()) {
            throw new GradleException("yanoDist=${override} is not a directory")
        }
        return dir
    }
    // A project-local .yano-node/ beats the pinned release: it usually symlinks a
    // locally built node, and putting one there is an explicit "use this". Needs
    // yano.jar AND config/ (genesis lives in config/network/<network>/).
    def local = new File(rootDir, '.yano-node')
    if (yanoNodeMarker(local).isFile() && new File(local, 'config').isDirectory()) {
        return local
    }
    if (distDir.isDirectory()) {
        return distDir
    }
    if (required) {
        throw new GradleException(
                "Yano node distribution ${yanoVersion} is not available.\n"
                        + "  Fetch it:      ./gradlew fetchYanoNode\n"
                        + "  Or point at a local build: -PyanoDist=/path/to/yano-dist "
                        + "(or YANO_DIST=…)")
    }
    return null
}

tasks.register('fetchYanoNode') {
    group = 'yano node'
    description = "Download and unpack the Yano node distribution (${yanoVersion})"
    outputs.dir(distDir)
    onlyIf {
        !(project.findProperty('yanoDist') ?: System.getenv('YANO_DIST')) && !distDir.isDirectory()
    }
    doLast {
        cacheRoot.mkdirs()
        def zip = new File(cacheRoot, zipName)
        if (!zip.exists()) {
            logger.lifecycle("Downloading ${downloadUrl} (~256 MB, once per version)…")
            def tmp = new File(cacheRoot, "${zipName}.part")
            tmp.delete()
            new URI(downloadUrl).toURL().withInputStream { input ->
                tmp.withOutputStream { it << input }
            }
            tmp.renameTo(zip)
        }

        def actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(zip.bytes).encodeHex().toString()
        def expected = expectedSha(distName.toString())
        if (expected == null) {
            logger.warn("No pinned checksum for ${distName}. Record it in "
                    + "gradle/yano-node.lock:\n    ${distName}=${actual}")
        } else if (expected != actual) {
            zip.delete()
            throw new GradleException("Checksum mismatch for ${zipName}\n"
                    + "  expected ${expected}\n  actual   ${actual}\n"
                    + "The download was deleted. Verify the release before retrying.")
        }

        // The zip already contains a yano-<version>/ root holding yano.jar,
        // config/ and bin/, so unpack into the cache root.
        def staging = new File(cacheRoot, "unpack-${yanoVersion}")
        project.delete(staging)
        copy {
            from zipTree(zip)
            into staging
        }
        def unpacked = staging.listFiles()?.find { it.isDirectory() } ?: staging
        project.delete(distDir)
        unpacked.renameTo(distDir)
        project.delete(staging)
        if (yanoNativeRequested) {
            // Gradle's zipTree does not preserve the POSIX executable bit, so the
            // unpacked binary would be non-executable and ManagedNode's spawn()
            // would fail with a permission error rather than anything diagnostic.
            def exe = yanoNodeMarker(distDir)
            if (exe.isFile()) {
                exe.setExecutable(true, false)
            }
        }
        logger.lifecycle("Yano node ${yanoVersion} ready at ${distDir}")
    }
}

tasks.register('yanoNodeChecksum') {
    group = 'yano node'
    description = "Print the SHA-256 of the pinned Yano release zip (to record in yano-node.lock)"
    doLast {
        def zip = new File(cacheRoot, zipName)
        if (!zip.exists()) {
            throw new GradleException("Run ./gradlew fetchYanoNode first (no ${zip})")
        }
        def sha = java.security.MessageDigest.getInstance('SHA-256')
                .digest(zip.bytes).encodeHex().toString()
        println "${distName}=${sha}"
    }
}

tasks.register('yanoNodeInfo') {
    group = 'yano node'
    description = 'Show which Yano node distribution this build will use'
    doLast {
        def dir = resolveYanoDist(false)
        println "pinned version : ${yanoVersion}"
        println "resolved dist  : ${dir ?: '(not available — run ./gradlew fetchYanoNode)'}"
        if (dir) {
            println "flavour       : ${yanoNativeRequested ? "native (" + nativePlatform + ")" : 'jvm (jar)'}"
            println "node artifact : ${yanoNodeMarker(dir).exists() ? 'yes' : 'MISSING'}"
            println "config/        : ${new File(dir, 'config').isDirectory() ? 'yes' : 'MISSING'}"
        }
    }
}
