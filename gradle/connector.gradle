// Packages wallet-connector/ as a downloadable zip: unzip it, then
// chrome://extensions -> Developer mode -> Load unpacked. It is also the shape
// the Chrome Web Store accepts at submission time, so one artifact serves both.
//
// wallet-connector/ is plain files, not a Gradle module (see settings.gradle) —
// there is nothing to compile, so this is a straight Zip of the source tree
// minus what only matters inside the repo.
//
// NO SIGNING KEY IS INVOLVED. manifest.json carries the *public* "key", which is
// what pins the extension id (bjnkcmbkjaebecgllkgbeapbjcknnedn) that the native
// messaging host allowlists — a plain zip loaded unpacked already gets that id.
// The private extension-key.pem only signs a .crx, and Chrome refuses off-store
// .crx installs anyway, so CI never needs the key and must not hold it.

import groovy.json.JsonSlurper

def connectorDir = file("$rootDir/wallet-connector")

// The connector carries the WALLET's version, so a release's assets all agree:
// yano-connector-0.1.0-pre3.zip next to yano-wallet-*-0.1.0-pre3.*. Shipping
// them together and versioning them apart only invites "which connector goes
// with which wallet?".
//
// Chrome will not accept "0.1.0-pre3" as a version — the manifest's `version`
// must be 1-4 dot-separated integers. So the pre-release suffix is stripped for
// `version` and the full string goes in `version_name`, which is exactly what
// that field is for and is what Chrome shows the user.
//
// The manifest in the repo is therefore a TEMPLATE: its version fields are
// rewritten into the zip, never edited in place, so the working tree does not
// churn on every release.
def walletVersion = (project.findProperty('walletVersion') ?: project.version).toString()
def chromeVersion = walletVersion.replaceFirst(/[-+].*$/, '')

def patchedManifest = layout.buildDirectory.file('connector/manifest.json')

tasks.register('connectorManifest') {
    description = 'Stamp the wallet version into a copy of the extension manifest'
    def source = new File(connectorDir, 'manifest.json')
    inputs.file(source)
    inputs.property('walletVersion', walletVersion)
    outputs.file(patchedManifest)
    doLast {
        def manifest = new JsonSlurper().parse(source)
        manifest.version = chromeVersion
        manifest.version_name = walletVersion
        def out = patchedManifest.get().asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
    }
}

// ./gradlew connectorZip
tasks.register('connectorZip', Zip) {
    group = 'distribution'
    description = 'Browser extension (CIP-30 connector) zip — unzip, then chrome://extensions > Load unpacked'

    // manifest.json MUST sit at the zip root. The Web Store rejects a nested
    // manifest, and unzipping already creates a folder named after the archive,
    // so a wrapping directory would only break the upload for nothing.
    from(connectorDir) {
        exclude 'dev/**'        // demo dApp + its node_modules — not part of the extension
        exclude 'README.md'     // repo-facing; the store listing carries the user-facing text
        exclude '**/.DS_Store'
        exclude 'manifest.json' // the stamped copy below replaces it
    }
    from(tasks.named('connectorManifest'))

    archiveFileName = "yano-connector-${walletVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')
}
