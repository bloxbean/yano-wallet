<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 260px; margin: 0; padding: 14px 16px;
      font: 13px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1f2547; color: #eef1ff;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
    .brand img { width: 20px; height: 20px; }
    .status { margin: 12px 0 4px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.06); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .ok { background: #46d18a; } .bad { background: #ff6b6b; } .wait { background: #9aa4d6; }
    .via { color: #9aa4d6; font-size: 11px; min-height: 14px; margin: 0 2px 8px; }
    .hint { color: #9aa4d6; font-size: 12px; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: #9aa4d6; font-size: 12px; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '▸ '; }
    details[open] summary::before { content: '▾ '; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    input { width: 72px; padding: 4px 6px; border-radius: 6px; border: 1px solid #3a4170; background: #161a34; color: #eef1ff; }
    button { padding: 4px 10px; border-radius: 6px; border: 0; background: #6ea8ff; color: #10142c; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="brand"><img src="icons/logo-48.png" alt="" />Yano Connector</div>
  <div class="status"><span id="dot" class="dot wait"></span><span id="status">Checking…</span></div>
  <div id="via" class="via"></div>
  <div class="hint">Open the Yano desktop wallet and unlock it, then connect from any dApp's wallet picker ("Yano").</div>
  <details>
    <summary>Advanced</summary>
    <div class="hint" style="margin-top:8px">Legacy WebSocket fallback — only used when the Native Messaging host isn't installed.</div>
    <div class="row"><span class="hint">WS port</span><input id="port" type="number" min="1" max="65535" /><button id="save">Save</button></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
