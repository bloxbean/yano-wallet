// Yano Wallet — desktop full-node wallet (ADR-033).
//
// Deliberately minimal: every module configures its own java plugin and
// dependencies (they did so in the Yano repo too, where they were excluded from
// the root's library conventions), so this only needs the shared repositories,
// group and version.

group = 'com.bloxbean.cardano.yano.wallet'
version = project.findProperty('walletVersion') ?: '0.1.0-SNAPSHOT'

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url "https://central.sonatype.com/repository/maven-snapshots/"
        }
    }

    // Each module already calls useJUnitPlatform(); this is the shared reporting
    // so a failure is readable without -i.
    tasks.withType(Test).configureEach {
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat = 'full'
        }
    }
}

// Resolves the Yano node distribution the wallet launches and bundles.
apply from: "$rootDir/gradle/yano-node.gradle"

// Packages the browser extension (wallet-connector/) as a loadable zip.
apply from: "$rootDir/gradle/connector.gradle"
