walletVersion = 0.1.0-pre1

# The Yano node release the wallet launches and bundles. Single source of truth —
# bumping this is the whole upgrade. Override per-invocation with -PyanoVersion=…,
# or point at a local build with -PyanoDist=/path (or YANO_DIST=…).
yanoVersion = 0.1.0-pre13

org.gradle.jvmargs = -Xmx2g
org.gradle.parallel = true
org.gradle.caching = true
