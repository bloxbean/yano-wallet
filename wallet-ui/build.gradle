plugins {
    id 'java-library'
}

java {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

dependencies {
    // Views depend ONLY on the async contract — wallet-core/CCL/node types
    // never cross into this module (ADR-033 module rules).
    def javafxVersion = libs.versions.javafx.get()
    def javafxPlatform = detectJavafxPlatform()

    api "org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}"
    api "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    api "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

test {
    useJUnitPlatform()
}

// The version shown in Settings > About comes from gradle.properties at BUILD
// time. A hand-edited constant is wrong the moment someone forgets to bump it,
// and the version is the first thing a bug report quotes.
//
// Generated as Java SOURCE, not a properties resource: native-image includes
// only resources that are explicitly registered, so a resource would work in the
// jar build and silently come back null in the native one — the version would be
// missing exactly where it is hardest to notice.
def buildInfoDir = layout.buildDirectory.dir('generated/sources/buildinfo')

def generateBuildInfo = tasks.register('generateBuildInfo') {
    description = 'Generate BuildInfo.java from gradle.properties'
    def walletVersion = project.version.toString()
    def nodeVersion = (rootProject.findProperty('yanoVersion') ?: 'unknown').toString()
    def outDir = buildInfoDir
    inputs.property('walletVersion', walletVersion)
    inputs.property('nodeVersion', nodeVersion)
    outputs.dir(outDir)
    doLast {
        def pkg = new File(outDir.get().asFile, 'com/bloxbean/cardano/yano/wallet/ui')
        pkg.mkdirs()
        new File(pkg, 'BuildInfo.java').text = """package com.bloxbean.cardano.yano.wallet.ui;

/**
 * Build-time facts, generated by :wallet-ui:generateBuildInfo from
 * gradle.properties. Do not edit — your changes are overwritten on every build.
 */
public final class BuildInfo {

    /** The wallet's version, e.g. "0.1.0-pre4". */
    public static final String WALLET_VERSION = "${walletVersion}";

    /** The managed Yano node this build is pinned to. */
    public static final String NODE_VERSION = "${nodeVersion}";

    private BuildInfo() {
    }
}
"""
    }
}

// Registering the provider (not the directory) makes compileJava depend on the
// generating task, so a plain `./gradlew build` cannot compile a stale copy.
sourceSets.main.java.srcDir generateBuildInfo


def detectJavafxPlatform() {
    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()

    if (osName.contains('mac') || osName.contains('darwin')) {
        return osArch.contains('aarch64') || osArch.contains('arm64') ? 'mac-aarch64' : 'mac'
    }
    if (osName.contains('windows')) {
        return 'win'
    }
    if (osName.contains('linux')) {
        return osArch.contains('aarch64') || osArch.contains('arm64') ? 'linux-aarch64' : 'linux'
    }

    throw new GradleException("Unsupported JavaFX platform: ${osName} ${osArch}")
}
